<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Menú educativo de MVG Learning para elegir nivel y grado: Inicial, Primaria y Secundaria." />
    <meta name="application-name" content="MVG Learning" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MVG Learning" />
    <title>MVG Learning | Elige tu grado</title>

    <!-- PWA -->
    <meta name="theme-color" content="#FFF8EC" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* =====================================
           COLORES Y MEDIDAS GENERALES
        ===================================== */
        :root {
            --bg: #FFF8EC;
            --ink: #2B2250;
            --muted: #6B6390;
            --white: #FFFFFF;
            --shadow: 0 6px 0 rgba(43, 34, 80, 0.12);

            /* Colores por nivel */
            --inicial: #FF6B9A;
            --inicial-soft: #FFE3EC;
            --primaria: #18B2FF;
            --primaria-soft: #DCF3FF;
            --secundaria: #8B5CF6;
            --secundaria-soft: #EDE5FF;
            --todos: #FFB627;
            --todos-soft: #FFF1D2;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            font-family: "Nunito", Arial, sans-serif;
            color: var(--ink);
            background: var(--bg);
            padding:
                env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        button {
            font: inherit;
            color: inherit;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 4px solid rgba(108, 76, 245, 0.45);
            outline-offset: 3px;
        }

        /* =====================================
           FONDO CON CÍRCULOS FLOTANTES
        ===================================== */
        .bg-shapes {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-shapes span {
            position: absolute;
            border-radius: 50%;
            opacity: 0.32;
            animation: float 14s ease-in-out infinite;
        }

        .bg-shapes span:nth-child(1) { width: 190px; height: 190px; background: #FFD23F; top: -50px; left: -60px; }
        .bg-shapes span:nth-child(2) { width: 130px; height: 130px; background: #3BCEAC; top: 32%; right: -45px; animation-delay: -4s; }
        .bg-shapes span:nth-child(3) { width: 230px; height: 230px; background: #FF6B9A; bottom: -90px; left: 22%; animation-delay: -8s; }
        .bg-shapes span:nth-child(4) { width: 95px; height: 95px; background: #8B5CF6; top: 58%; left: 4%; animation-delay: -2s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0); }
            50% { transform: translate(20px, -26px) rotate(10deg); }
        }

        /* =====================================
           CONTENEDOR
        ===================================== */
        .wrap {
            position: relative;
            z-index: 1;
            width: min(100%, 1320px);
            margin: 0 auto;
            padding: 14px 16px 28px;
        }

        /* =====================================
           ENCABEZADO DELGADO
        ===================================== */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 60px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            color: var(--ink);
            text-decoration: none;
        }

        .logo-box {
            width: 54px;
            height: 54px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border: 4px solid var(--white);
            border-radius: 18px;
            color: var(--white);
            font-family: "Baloo 2", sans-serif;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(145deg, #FF6AA9, #8B5CF6);
            box-shadow: 0 5px 0 rgba(78, 51, 170, 0.35);
            transform: rotate(-4deg);
        }

        .brand-name {
            font-family: "Baloo 2", sans-serif;
            font-size: clamp(22px, 4vw, 28px);
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
        }

        .brand-name b {
            color: #8B5CF6;
        }

        .top-actions {
            display: flex;
            gap: 10px;
            flex: 0 0 auto;
        }

        .round-btn {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 50%;
            font-size: 24px;
            background: var(--white);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .round-btn:hover { transform: translateY(-2px); }
        .round-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(43, 34, 80, 0.12); }

        /* =====================================
           SALUDO
        ===================================== */
        .hero {
            text-align: center;
            margin: 12px 0 16px;
        }

        .hero h1 {
            margin: 0;
            font-family: "Baloo 2", sans-serif;
            font-size: clamp(34px, 6vw, 52px);
            line-height: 1;
        }

        .hero p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: clamp(17px, 2.6vw, 21px);
            font-weight: 800;
        }

        .wave {
            display: inline-block;
            transform-origin: 70% 70%;
            animation: wave 2.2s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 60%, 100% { transform: rotate(0); }
            10%, 30% { transform: rotate(16deg); }
            20%, 40% { transform: rotate(-8deg); }
        }

        /* =====================================
           PESTAÑAS DE NIVEL
        ===================================== */
        .tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 0 0 18px;
        }

        .tab {
            --c: var(--todos);
            --c-soft: var(--todos-soft);
            min-height: 52px;
            padding: 8px 18px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 3px solid var(--c);
            border-radius: 999px;
            color: var(--ink);
            font-family: "Baloo 2", sans-serif;
            font-size: 19px;
            font-weight: 800;
            background: var(--white);
            box-shadow: 0 4px 0 var(--c-soft);
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
        }

        .tab[data-level="inicial"] { --c: var(--inicial); --c-soft: var(--inicial-soft); }
        .tab[data-level="primaria"] { --c: var(--primaria); --c-soft: var(--primaria-soft); }
        .tab[data-level="secundaria"] { --c: var(--secundaria); --c-soft: var(--secundaria-soft); }

        .tab:hover { transform: translateY(-2px); }

        .tab[aria-pressed="true"] {
            color: var(--white);
            background: var(--c);
            box-shadow: 0 4px 0 rgba(43, 34, 80, 0.18);
        }

        /* =====================================
           GRILLA DE TARJETAS
        ===================================== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr));
            gap: 16px;
        }

        /* Título de nivel (solo en la vista "Todos") */
        .level-title {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0 -4px;
            font-family: "Baloo 2", sans-serif;
            font-size: clamp(22px, 3vw, 27px);
            line-height: 1;
        }

        .level-title:first-child {
            margin-top: 0;
        }

        .level-title::after {
            content: "";
            flex: 1;
            height: 4px;
            border-radius: 4px;
            background: var(--c-soft);
        }

        .card {
            --c: var(--primaria);
            --c-soft: var(--primaria-soft);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 22px 10px 18px;
            border: 4px solid var(--c);
            border-radius: 26px;
            background: var(--white);
            box-shadow: var(--shadow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .card.lvl-inicial,
        .level-title.lvl-inicial { --c: var(--inicial); --c-soft: var(--inicial-soft); }
        .card.lvl-primaria,
        .level-title.lvl-primaria { --c: var(--primaria); --c-soft: var(--primaria-soft); }
        .card.lvl-secundaria,
        .level-title.lvl-secundaria { --c: var(--secundaria); --c-soft: var(--secundaria-soft); }

        .card:hover {
            transform: translateY(-4px) rotate(-1deg);
        }

        .card:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(43, 34, 80, 0.12);
        }

        /* Enlace que cubre toda la tarjeta */
        .card-link {
            position: absolute;
            inset: 0;
            z-index: 1;
            border-radius: 22px;
        }

        .card-icon {
            width: 88px;
            height: 88px;
            display: grid;
            place-items: center;
            margin-bottom: 8px;
            border-radius: 50%;
            font-size: 46px;
            line-height: 1;
            background: var(--c-soft);
        }

        .card-title {
            margin: 0;
            font-family: "Baloo 2", sans-serif;
            font-size: 22px;
            line-height: 1.05;
            font-weight: 800;
        }

        .card-desc {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.3;
            font-weight: 700;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 900;
            color: var(--ink);
            background: var(--c-soft);
        }

        .card-share {
            position: absolute;
            top: 6px;
            left: 6px;
            z-index: 2;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 50%;
            font-size: 17px;
            background: transparent;
            cursor: pointer;
            opacity: 0.75;
            transition: background 0.15s ease, opacity 0.15s ease;
        }

        .card-share:hover {
            opacity: 1;
            background: var(--c-soft);
        }

        /* =====================================
           PIE DE PÁGINA Y AVISO
        ===================================== */
        .footer {
            margin-top: 26px;
            text-align: center;
            color: var(--muted);
            font-size: 15px;
            font-weight: 800;
        }

        .footer b {
            color: var(--ink);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(22px + env(safe-area-inset-bottom));
            z-index: 10;
            max-width: calc(100% - 32px);
            padding: 13px 22px;
            border-radius: 999px;
            color: var(--white);
            font-size: 17px;
            font-weight: 900;
            text-align: center;
            background: var(--ink);
            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, 30px);
            transition: transform 0.3s ease, opacity 0.3s ease, visibility 0.3s;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }

        /* =====================================
           CELULAR
        ===================================== */
        @media (max-width: 480px) {
            .wrap {
                padding-inline: 12px;
            }

            .brand-name {
                font-size: 21px;
            }

            .round-btn {
                width: 48px;
                height: 48px;
                font-size: 21px;
            }

            .tab {
                min-height: 48px;
                padding: 6px 14px;
                font-size: 17px;
            }

            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .card {
                padding: 18px 8px 14px;
                border-radius: 22px;
            }

            .card-icon {
                width: 64px;
                height: 64px;
                font-size: 34px;
            }

            .card-title {
                font-size: 20px;
            }

            .card-desc {
                display: none;
            }

            .card-tag {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="bg-shapes" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

    <div class="wrap">
        <!-- Encabezado -->
        <header class="topbar">
            <a class="brand" href="./" aria-label="MVG Learning, ir al inicio">
                <span class="logo-box" aria-hidden="true">MVG</span>
                <span class="brand-name">MVG <b>Learning</b></span>
            </a>

            <div class="top-actions">
                <button class="round-btn" id="soundBtn" type="button" aria-label="Activar o desactivar sonido">🔊</button>
                <button class="round-btn" id="shareAppBtn" type="button" aria-label="Compartir la app">📤</button>
            </div>
        </header>

        <!-- Saludo -->
        <section class="hero">
            <h1>¡Hola! <span class="wave" aria-hidden="true">👋</span></h1>
            <p>¿Qué grado vas a estudiar hoy?</p>
        </section>

        <!-- Pestañas -->
        <nav class="tabs" id="tabs" aria-label="Elegir nivel"></nav>

        <!-- Tarjetas -->
        <main class="grid" id="grid"></main>

        <footer class="footer"><b>MVG Learning</b> · Aprender, jugar y crecer juntos</footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        /* =========================================================
           LISTA DE GRADOS
           Para cambiar un enlace, edita su "href".
        ========================================================= */
        const courses = [
            // EDUCACIÓN INICIAL
            { id: 1, emoji: "3️⃣", title: "3 años", desc: "Primeros números, palabras, colores, formas y actividades para aprender jugando.", href: "3years/index3Year.html", level: "inicial" },
            { id: 2, emoji: "4️⃣", title: "4 años", desc: "Desarrolla lenguaje, pensamiento lógico, creatividad y autonomía paso a paso.", href: "4years/index4Year.html", level: "inicial" },
            { id: 3, emoji: "5️⃣", title: "5 años", desc: "Prepárate para Primaria con lectura inicial, números, retos y juegos educativos.", href: "5years/index5Year.html", level: "inicial" },

            // EDUCACIÓN PRIMARIA
            { id: 4, emoji: "1️⃣", title: "1.º de Primaria", desc: "Lectura, escritura, números y razonamiento mediante experiencias sencillas y divertidas.", href: "index1Primary.html", level: "primaria" },
            { id: 5, emoji: "2️⃣", title: "2.º de Primaria", desc: "Fortalece comprensión lectora, operaciones básicas y resolución de problemas.", href: "index2Primary.html", level: "primaria" },
            { id: 6, emoji: "3️⃣", title: "3.º de Primaria", desc: "Avanza en matemáticas, comunicación, ciencias y pensamiento crítico.", href: "index3Primary.html", level: "primaria" },
            { id: 7, emoji: "4️⃣", title: "4.º de Primaria", desc: "Practica estrategias, comprensión, cálculo y proyectos interdisciplinarios.", href: "index4Primary.html", level: "primaria" },
            { id: 8, emoji: "5️⃣", title: "5.º de Primaria", desc: "Resuelve retos de mayor nivel y consolida conocimientos esenciales.", href: "index5Primary.html", level: "primaria" },
            { id: 9, emoji: "6️⃣", title: "6.º de Primaria", desc: "Prepárate para Secundaria con razonamiento, análisis y aprendizaje autónomo.", href: "index6Primary.html", level: "primaria" },

            // EDUCACIÓN SECUNDARIA
            { id: 10, emoji: "1️⃣", title: "1.º de Secundaria", desc: "Inicia una nueva etapa con bases sólidas en ciencias, letras y tecnología.", href: "index1Secondary.html", level: "secundaria" },
            { id: 11, emoji: "2️⃣", title: "2.º de Secundaria", desc: "Profundiza conceptos y aplica estrategias para resolver nuevos desafíos.", href: "index2Secondary.html", level: "secundaria" },
            { id: 12, emoji: "3️⃣", title: "3.º de Secundaria", desc: "Desarrolla análisis, investigación, pensamiento matemático y comunicación.", href: "index3Secondary.html", level: "secundaria" },
            { id: 13, emoji: "4️⃣", title: "4.º de Secundaria", desc: "Consolida competencias académicas y prepárate para retos preuniversitarios.", href: "index4Secondary.html", level: "secundaria" },
            { id: 14, emoji: "5️⃣", title: "5.º de Secundaria", desc: "Fortalece tu preparación final para estudios superiores y nuevos proyectos.", href: "index5Secondary.html", level: "secundaria" }
        ];

        // Niveles en el orden en que aparecen las pestañas
        const levels = [
            { key: "inicial", name: "Inicial", emoji: "🧸" },
            { key: "primaria", name: "Primaria", emoji: "🎒" },
            { key: "secundaria", name: "Secundaria", emoji: "🚀" },
            { key: "todos", name: "Todos", emoji: "⭐" }
        ];

        const el = {
            tabs: document.getElementById("tabs"),
            grid: document.getElementById("grid"),
            toast: document.getElementById("toast"),
            soundBtn: document.getElementById("soundBtn"),
            shareAppBtn: document.getElementById("shareAppBtn")
        };

        /* =========================================================
           PREFERENCIAS GUARDADAS (nivel elegido y sonido)
        ========================================================= */
        function readPref(key, fallback) {
            try { return localStorage.getItem(key) ?? fallback; } catch (e) { return fallback; }
        }

        function savePref(key, value) {
            try { localStorage.setItem(key, value); } catch (e) { /* sin almacenamiento: no pasa nada */ }
        }

        let currentLevel = readPref("mvg-nivel", "todos");
        if (!levels.some(l => l.key === currentLevel)) currentLevel = "todos";
        let soundOn = readPref("mvg-sonido", "on") !== "off";

        /* =========================================================
           SONIDO "POP" (sin archivos de audio)
        ========================================================= */
        let audioCtx;

        function pop(freq = 520) {
            if (!soundOn) return;
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const t = audioCtx.currentTime;
                osc.type = "sine";
                osc.frequency.setValueAtTime(freq, t);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.8, t + 0.12);
                gain.gain.setValueAtTime(0.25, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start();
                osc.stop(t + 0.2);
            } catch (e) { /* el navegador no permite audio */ }
        }

        function updateSoundBtn() {
            el.soundBtn.textContent = soundOn ? "🔊" : "🔇";
            el.soundBtn.setAttribute("aria-pressed", String(soundOn));
        }

        /* =========================================================
           AVISO (TOAST)
        ========================================================= */
        let toastTimer;

        function showToast(message) {
            el.toast.textContent = message;
            el.toast.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.toast.classList.remove("show"), 2600);
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        /* =========================================================
           PESTAÑAS
        ========================================================= */
        function renderTabs() {
            el.tabs.innerHTML = levels.map(l => `
                <button class="tab" type="button" data-level="${l.key}" aria-pressed="${l.key === currentLevel}">
                    <span aria-hidden="true">${l.emoji}</span> ${l.name}
                </button>`).join("");
        }

        el.tabs.addEventListener("click", event => {
            const tab = event.target.closest(".tab");
            if (!tab) return;
            currentLevel = tab.dataset.level;
            savePref("mvg-nivel", currentLevel);
            pop(440);
            el.tabs.querySelectorAll(".tab").forEach(t =>
                t.setAttribute("aria-pressed", String(t.dataset.level === currentLevel)));
            renderCards();
        });

        /* =========================================================
           TARJETAS
        ========================================================= */
        function levelName(key) {
            return levels.find(l => l.key === key)?.name ?? "";
        }

        function cardHtml(course) {
            return `
                <article class="card lvl-${course.level}">
                    <a class="card-link" href="${escapeHtml(course.href)}" data-pop="${course.id}"
                       aria-label="Ingresar a ${escapeHtml(course.title)}"></a>
                    <button class="card-share" type="button" data-share="${course.id}"
                            aria-label="Compartir ${escapeHtml(course.title)}">📤</button>
                    <span class="card-tag">${levelName(course.level)}</span>
                    <span class="card-icon" aria-hidden="true">${course.emoji}</span>
                    <h2 class="card-title">${escapeHtml(course.title)}</h2>
                    <p class="card-desc">${escapeHtml(course.desc)}</p>
                </article>`;
        }

        function renderCards() {
            let html = "";

            levels.filter(l => l.key !== "todos").forEach(level => {
                if (currentLevel !== "todos" && currentLevel !== level.key) return;
                const grades = courses.filter(c => c.level === level.key);
                if (grades.length === 0) return;

                // En "Todos" se agrega un título por nivel
                if (currentLevel === "todos") {
                    html += `<h2 class="level-title lvl-${level.key}"><span aria-hidden="true">${level.emoji}</span> ${level.name}</h2>`;
                }
                html += grades.map(cardHtml).join("");
            });

            el.grid.innerHTML = html;
        }

        el.grid.addEventListener("click", event => {
            const shareBtn = event.target.closest("[data-share]");
            if (shareBtn) {
                pop(620);
                shareCourse(Number(shareBtn.dataset.share));
                return;
            }

            const link = event.target.closest("[data-pop]");
            if (link) pop(400 + Number(link.dataset.pop) * 25);
        });

        /* =========================================================
           COMPARTIR
        ========================================================= */
        async function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                return;
            }
            const area = document.createElement("textarea");
            area.value = text;
            area.setAttribute("readonly", "");
            area.style.position = "fixed";
            area.style.opacity = "0";
            document.body.appendChild(area);
            area.select();
            const ok = document.execCommand("copy");
            area.remove();
            if (!ok) throw new Error("No se pudo copiar");
        }

        async function shareContent({ title, text, url }) {
            if (navigator.share) {
                try {
                    await navigator.share({ title, text, url });
                    showToast("¡Compartido! 🎉");
                    return;
                } catch (error) {
                    if (error.name === "AbortError") return;
                }
            }
            try {
                await copyText(url);
                showToast("¡Enlace copiado! 🔗");
            } catch (error) {
                showToast("No se pudo copiar el enlace ⚠️");
            }
        }

        function shareCourse(id) {
            const course = courses.find(c => c.id === id);
            if (!course) return;
            shareContent({
                title: `MVG Learning · ${course.title}`,
                text: `${course.desc} Ingresa a ${course.title} en MVG Learning.`,
                url: new URL(course.href, window.location.href).href
            });
        }

        el.shareAppBtn.addEventListener("click", () => {
            pop(620);
            shareContent({
                title: "MVG Learning",
                text: "Elige tu grado y aprende jugando con MVG Learning.",
                url: window.location.href
            });
        });

        el.soundBtn.addEventListener("click", () => {
            soundOn = !soundOn;
            savePref("mvg-sonido", soundOn ? "on" : "off");
            updateSoundBtn();
            pop();
        });

        /* =========================================================
           INICIO
        ========================================================= */
        updateSoundBtn();
        renderTabs();
        renderCards();

        // Registrar Service Worker (PWA)
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js", { scope: "./" })
                    .catch(error => console.error("No se pudo registrar el Service Worker:", error));
            });
        }
    </script>
</body>

</html>
